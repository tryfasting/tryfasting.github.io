name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore portrait from private deployment inputs
        env:
          PHOTO_1: ${{ secrets.PORTFOLIO_PORTRAIT_1 }}
          PHOTO_2: ${{ secrets.PORTFOLIO_PORTRAIT_2 }}
          PHOTO_3: ${{ secrets.PORTFOLIO_PORTRAIT_3 }}
          PHOTO_4: ${{ secrets.PORTFOLIO_PORTRAIT_4 }}
          PHOTO_5: ${{ secrets.PORTFOLIO_PORTRAIT_5 }}
          PHOTO_6: ${{ secrets.PORTFOLIO_PORTRAIT_6 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          encoded = ''.join(os.environ[f'PHOTO_{i}'] for i in range(1, 7))
          if not encoded:
              raise SystemExit('Portrait deployment input is missing')
          photo = base64.b64decode(encoded, validate=True)
          if not photo.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Portrait input is not a JPEG')
          Path('public/portrait-local.jpg').write_bytes(photo)
          PY

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
